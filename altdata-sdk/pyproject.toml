[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "altdata"
version = "0.1.0"
description = "Python SDK for the Alternative Data Platform API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Alternative Data Platform Team" }
]
keywords = ["alternative-data", "finance", "api", "sdk", "quant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "respx>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/KTMAnimations/alternative-data"
Documentation = "https://github.com/KTMAnimations/alternative-data#readme"
Repository = "https://github.com/KTMAnimations/alternative-data"

[tool.hatch.build.targets.wheel]
packages = ["altdata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=altdata --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["altdata"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
