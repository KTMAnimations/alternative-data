name: Terraform

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'

env:
  TF_VERSION: 1.6.0
  AWS_REGION: us-east-1

jobs:
  terraform-staging:
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan (Staging)
        if: github.event_name == 'pull_request'
        run: |
          terraform plan \
            -var-file=environments/staging.tfvars \
            -var="db_username=${{ secrets.DB_USERNAME }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="api_key_admin=${{ secrets.API_KEY_ADMIN }}" \
            -var="api_key_default=${{ secrets.API_KEY_DEFAULT }}" \
            -var="certificate_arn=${{ secrets.CERTIFICATE_ARN }}" \
            -var="container_image=${{ secrets.ECR_REGISTRY }}/altdata-staging:latest" \
            -out=tfplan

      - name: Terraform Apply (Staging)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          terraform apply \
            -var-file=environments/staging.tfvars \
            -var="db_username=${{ secrets.DB_USERNAME }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="api_key_admin=${{ secrets.API_KEY_ADMIN }}" \
            -var="api_key_default=${{ secrets.API_KEY_DEFAULT }}" \
            -var="certificate_arn=${{ secrets.CERTIFICATE_ARN }}" \
            -var="container_image=${{ secrets.ECR_REGISTRY }}/altdata-staging:latest" \
            -auto-approve

  terraform-production:
    needs: terraform-staging
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply (Production)
        run: |
          terraform apply \
            -var-file=environments/production.tfvars \
            -var="db_username=${{ secrets.DB_USERNAME }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="api_key_admin=${{ secrets.API_KEY_ADMIN }}" \
            -var="api_key_default=${{ secrets.API_KEY_DEFAULT }}" \
            -var="certificate_arn=${{ secrets.CERTIFICATE_ARN }}" \
            -var="container_image=${{ secrets.ECR_REGISTRY }}/altdata-production:latest" \
            -auto-approve
